openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: CS Rescue API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: architecture
    description: Architecture nodes and diagram
  - name: resources
    description: System resources and integrations
  - name: connectors
    description: Connector registry and configuration
  - name: deployments
    description: Customer deployments and rollouts
  - name: accounts
    description: Customer accounts
  - name: lifecycle
    description: Lifecycle motions
  - name: portfolio
    description: PE-firm tenant portfolio bootstrap data
  - name: Auth
    description: Browser and mobile authentication endpoints.
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /architecture:
    get:
      operationId: getArchitecture
      tags: [architecture]
      summary: Get full architecture map
      responses:
        "200":
          description: Full architecture data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchitectureMap"

  /graph:
    get:
      operationId: getGraph
      tags: [architecture]
      summary: Get the full architecture graph (nodes + edges + groups)
      responses:
        "200":
          description: Graph data for visualization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GraphData"

  /edges:
    get:
      operationId: listEdges
      tags: [architecture]
      summary: List all architecture edges
      responses:
        "200":
          description: List of edges
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ArchitectureEdge"

  /metrics/{nodeId}:
    get:
      operationId: getNodeMetrics
      tags: [architecture]
      summary: Get time-series metrics for a node
      parameters:
        - name: nodeId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of metric series for the node
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NodeMetricSeries"

  /architecture/nodes:
    get:
      operationId: listArchitectureNodes
      tags: [architecture]
      summary: List all architecture nodes
      parameters:
        - name: layer
          in: query
          schema:
            type: string
            enum: [lifecycle, delivery, platform]
        - name: lifecycleMotionId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of nodes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ArchitectureNode"

  /architecture/nodes/{id}:
    get:
      operationId: getArchitectureNode
      tags: [architecture]
      summary: Get a specific architecture node
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Node detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchitectureNode"
        "404":
          description: Not found

  /architecture/summary:
    get:
      operationId: getArchitectureSummary
      tags: [architecture]
      summary: Get architecture summary stats
      responses:
        "200":
          description: Summary statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchitectureSummary"

  /resources:
    get:
      operationId: listResources
      tags: [resources]
      summary: List all resources
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of resources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Resource"
    post:
      operationId: createResource
      tags: [resources]
      summary: Create a new resource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewResourceInput"
      responses:
        "201":
          description: Created resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"

  /resources/{id}:
    get:
      operationId: getResource
      tags: [resources]
      summary: Get a resource by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Resource detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"
        "404":
          description: Not found
    patch:
      operationId: updateResource
      tags: [resources]
      summary: Update a resource
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchResourceInput"
      responses:
        "200":
          description: Updated resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"

  /connectors:
    get:
      operationId: listConnectors
      tags: [connectors]
      summary: List all connectors
      responses:
        "200":
          description: List of connectors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Connector"
    post:
      operationId: createConnector
      tags: [connectors]
      summary: Register a new connector
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewConnectorInput"
      responses:
        "201":
          description: Created connector
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connector"

  /connectors/{id}:
    patch:
      operationId: updateConnector
      tags: [connectors]
      summary: Update a connector
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchConnectorInput"
      responses:
        "200":
          description: Updated connector
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connector"

  /connectors/health:
    get:
      operationId: getConnectorHealth
      tags: [connectors]
      summary: Get health status of all connectors
      responses:
        "200":
          description: Connector health overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectorHealthSummary"

  /deployments:
    get:
      operationId: listDeployments
      tags: [deployments]
      summary: List all deployments
      parameters:
        - name: accountId
          in: query
          schema:
            type: string
        - name: stage
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of deployments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Deployment"

  /deployments/{id}:
    get:
      operationId: getDeployment
      tags: [deployments]
      summary: Get a deployment by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deployment detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deployment"
        "404":
          description: Not found

  /accounts:
    get:
      operationId: listAccounts
      tags: [accounts]
      summary: List all accounts
      responses:
        "200":
          description: List of accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Account"

  /lifecycle-motions:
    get:
      operationId: listLifecycleMotions
      tags: [lifecycle]
      summary: List all lifecycle motions
      responses:
        "200":
          description: List of lifecycle motions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LifecycleMotion"

  /portfolio/bootstrap:
    get:
      operationId: getPortfolioBootstrap
      tags: [portfolio]
      summary: Get raw portfolio bootstrap data for all firm tenants
      description: >
        Serves RAW company/assessment data sourced from Postgres — no derived
        values (tiers, composites, gaps, etc). Clients re-derive those via
        @workspace/portfolio-engine. Returns 500 if the underlying data fails
        validation at load time (fail-soft: never crashes the server).
      responses:
        "200":
          description: Raw portfolio bootstrap payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioBootstrap"
        "500":
          description: Portfolio data failed validation and could not be served
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /admin/firms:
    get:
      operationId: listAdminFirms
      tags: [admin]
      summary: List all firms with company counts, for the internal admin index
      responses:
        "200":
          description: All firms
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminFirmSummary"
    post:
      operationId: createAdminFirm
      tags: [admin]
      summary: Create a new firm (status "pending") and queue a discovery job
      description: >
        Landing step of the internal /admin firm-onboarding flow. Creates a
        firm row with status "pending" and a matching jobs row
        (type "discovery", status "queued") targeting that firm. The job is a
        stub — nothing actually runs discovery yet.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAdminFirmInput"
      responses:
        "201":
          description: Created firm and queued discovery job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateAdminFirmResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /admin/firms/{id}:
    get:
      operationId: getAdminFirm
      tags: [admin]
      summary: Get a firm and its companies, for the review screen
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Firm detail with companies
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminFirmDetail"
        "404":
          description: Firm not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /admin/firms/{id}/companies:
    post:
      operationId: addAdminFirmCompany
      tags: [admin]
      summary: Add a company to a firm under review
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddAdminCompanyInput"
      responses:
        "201":
          description: Company added to the firm
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Firm not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /admin/firms/{id}/confirm:
    post:
      operationId: confirmAdminFirm
      tags: [admin]
      summary: Confirm the reviewed company selection and queue a build job
      description: >
        Marks the selected companies "active" and any unselected companies
        "excluded", sets the firm's status to "reviewed", and queues a stub
        jobs row (type "build", status "queued") targeting the firm.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmAdminFirmInput"
      responses:
        "200":
          description: Firm confirmed and build job queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminFirmConfirmResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Firm not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: A build job for this firm is already queued or running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActiveJobConflict"

  /admin/companies/{id}/report-data:
    get:
      operationId: getAdminCompanyReportData
      tags: [admin]
      summary: Assemble the report-data.json export payload from a company's latest assessment
      description: >
        Builds the report-data.json object for the Diagnostic Report export
        runbook from the company's most recent assessment: raw p1-p8 scores,
        derived composite/tier, and firm name as parentFund. Narrative fields
        (execSummary, gaps, nextSteps) are left empty for Claude's research to
        fill in later.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Assembled report-data.json payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCompanyReportData"
        "404":
          description: Company not found, or has no assessments yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /admin/seed-legacy-tenants:
    post:
      operationId: seedLegacyTenants
      tags: [admin]
      summary: One-time idempotent seed of the 5 legacy demo tenants (stg/pamlico/raviga/longarc/solen)
      description: >
        Inserts firm/company/assessment rows for any of the 5 legacy demo
        tenant slugs (stg, pamlico, raviga, longarc, solen) not already
        present in the firms table. Any slug that already exists — including
        an unrelated real client firm — is left completely untouched and
        reported as "skipped". Safe to call repeatedly: a partial prior run
        (e.g. a crash mid-seed) only fills in whatever slugs are still
        missing on the next call.
      responses:
        "200":
          description: Per-slug seed result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeedLegacyTenantsResult"
        "401":
          description: Not authenticated as an allowed admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Seeding failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /jobs/{id}:
    get:
      operationId: getJob
      tags: [jobs]
      summary: Get a job's current status, progress, and ETA
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Job status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          description: Job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "200":
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserEnvelope"
  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          description: Relative path to redirect to after login (must start with `/`). Defaults to `/`.
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the OIDC authorization endpoint.
  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: iss
          in: query
          required: false
          schema:
            type: string
            format: uri
      responses:
        "302":
          description: Redirect to the `returnTo` path on success (defaults to `/`) or `/api/login` on failure.
  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the session and begin OIDC logout
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "302":
          description: Redirect to the OIDC provider logout URL.
  /mobile-auth/token-exchange:
    post:
      tags: [Auth]
      operationId: exchangeMobileAuthorizationCode
      summary: Exchange a mobile OIDC code for a session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MobileTokenExchangeRequest"
      responses:
        "200":
          description: Session created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileTokenExchangeSuccess"
        "400":
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Token did not contain usable claims.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Token exchange failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /mobile-auth/logout:
    post:
      tags: [Auth]
      operationId: logoutMobileSession
      summary: Delete a mobile session token
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
      responses:
        "200":
          description: Logout processed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutSuccess"

components:
  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: Opaque session token — `Bearer <sid>`.
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Browser session cookie.
      schema:
        type: string
  schemas:
    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl]
      properties:
        id:
          type: string
        email:
          type: [string, "null"]
          format: email
        firstName:
          type: [string, "null"]
        lastName:
          type: [string, "null"]
        profileImageUrl:
          type: [string, "null"]
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: "#/components/schemas/AuthUser"
            - type: "null"
    MobileTokenExchangeRequest:
      type: object
      required: [code, code_verifier, redirect_uri, state]
      properties:
        code:
          type: string
          minLength: 1
        code_verifier:
          type: string
          minLength: 1
        redirect_uri:
          type: string
          minLength: 1
          format: uri
        state:
          type: string
          minLength: 1
        nonce:
          type: string
          minLength: 1
    MobileTokenExchangeSuccess:
      type: object
      required: [token]
      properties:
        token:
          type: string
    LogoutSuccess:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          const: true
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string

    ActiveJobConflict:
      type: object
      description: >
        Returned instead of creating a duplicate job when the target already
        has a queued/running job of the requested type.
      required: [error, job]
      properties:
        error:
          type: string
        job:
          $ref: "#/components/schemas/Job"

    CreateAdminFirmInput:
      type: object
      required: [name, website]
      properties:
        name:
          type: string
          minLength: 1
        website:
          type: string
          minLength: 1

    Firm:
      type: object
      required: [id, name, website, slug, status, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        website:
          type: [string, "null"]
        slug:
          type: string
        status:
          type: string
        createdByEmail:
          type: [string, "null"]
          description: >
            Email of the admin who created this firm, captured from their
            session at creation time. Used to notify them when the build job
            finishes. Null for firms created before this field existed or
            outside an authenticated session.
        createdAt:
          type: string
          format: date-time

    Job:
      type: object
      required: [id, type, targetId, status, progressPct, etaSeconds, error]
      properties:
        id:
          type: integer
        type:
          type: string
        targetId:
          type: string
        status:
          type: string
        progressPct:
          type: integer
        etaSeconds:
          type: [integer, "null"]
        error:
          type: [string, "null"]

    CreateAdminFirmResponse:
      type: object
      required: [firm, job]
      properties:
        firm:
          $ref: "#/components/schemas/Firm"
        job:
          $ref: "#/components/schemas/Job"

    AdminFirmSummary:
      type: object
      required: [id, name, website, slug, status, companyCount, createdAt, latestJob]
      properties:
        id:
          type: integer
        name:
          type: string
        website:
          type: [string, "null"]
        slug:
          type: string
        status:
          type: string
        companyCount:
          type: integer
        latestJob:
          description: The most recently created job (any status) targeting this firm, or null if none exists.
          oneOf:
            - $ref: "#/components/schemas/Job"
            - type: "null"
        createdAt:
          type: string
          format: date-time

    Company:
      type: object
      required: [id, firmId, name, website, status, slug, createdAt, hasAssessment]
      properties:
        id:
          type: integer
        firmId:
          type: integer
        name:
          type: string
        website:
          type: [string, "null"]
        status:
          type: string
        slug:
          type: [string, "null"]
        createdAt:
          type: string
          format: date-time
        hasAssessment:
          type: boolean
          description: Whether the company has at least one assessment row (eligible for report export).

    AdminCompanyReportData:
      type: object
      description: >
        Assembled report-data.json payload for the Diagnostic Report export
        pattern, sourced from a company's latest assessment. Narrative fields
        (execSummary, gaps, nextSteps) are left empty since they come from
        Claude's research, not the raw scoring data.
      required:
        [
          companyId,
          companyName,
          parentFund,
          preparedForName,
          preparedForTitle,
          reportDate,
          assessmentDate,
          scores,
          evidence,
          composite,
          compositeMax,
          tier,
          execSummary,
          gaps,
          nextSteps,
        ]
      properties:
        companyId:
          type: integer
        companyName:
          type: string
        parentFund:
          type: string
        preparedForName:
          type: string
        preparedForTitle:
          type: string
        reportDate:
          type: string
          description: Date this report-data.json was assembled (ISO date).
        assessmentDate:
          type: string
          description: Date of the source assessment used (ISO date).
        scores:
          type: object
          required: [p1, p2, p3, p4, p5, p6, p7, p8]
          properties:
            p1:
              type: string
            p2:
              type: string
            p3:
              type: string
            p4:
              type: string
            p5:
              type: string
            p6:
              type: string
            p7:
              type: string
            p8:
              type: string
        evidence:
          type: object
          description: >
            Per-pillar evidence text Claude produced during scoring
            (assessments.p{n}Evidence), for admin QA review alongside the
            scorecard. Null for a pillar with no evidence on file.
          required: [p1, p2, p3, p4, p5, p6, p7, p8]
          properties:
            p1:
              type: [string, "null"]
            p2:
              type: [string, "null"]
            p3:
              type: [string, "null"]
            p4:
