        - summary
        - assessments

    PortfolioBootstrapFirm:
      type: object
      properties:
        slug:
          type: string
        displayName:
          type: string
        statusLabel:
          type: string
        internalOnly:
          type: boolean
        requireLogin:
          type: boolean
          description: >
            When true, the tenant portal requires an authenticated admin
            session. Absent/false = public (no behavior change).
        companies:
          type: array
          items:
            $ref: "#/components/schemas/PortfolioCompany"
      required:
        - slug
        - displayName
        - statusLabel
        - internalOnly
        - companies

    SystemHealthFirmIssue:
      type: object
      properties:
        firmId:
          type: integer
        firmName:
          type: string
        slug:
          type: string
        firmStatus:
          type: string
        issue:
          type: string
          enum:
            - discovery_empty
            - discovery_failed
            - build_failed
            - ready_no_active_companies
            - pending_no_job
            - candidate_review_needed
        issueLabel:
          type: string
        severity:
          type: string
          enum: [broken, needs_action]
        recoveryUrl:
          type: string
        lastJobType:
          type: string
          nullable: true
        lastJobStatus:
          type: string
          nullable: true
        companyCount:
          type: integer
      required:
        - firmId
        - firmName
        - slug
        - firmStatus
        - issue
        - issueLabel
        - severity
        - recoveryUrl
        - companyCount

    SystemHealthReport:
      type: object
      properties:
        ok:
          type: boolean
          description: True when no firm is in a broken state
        checkedAt:
          type: string
          description: ISO 8601 timestamp of when this check ran
        summary:
          type: object
          properties:
            total:
              type: integer
            healthy:
              type: integer
            needsAction:
              type: integer
            broken:
              type: integer
          required: [total, healthy, needsAction, broken]
        issues:
          type: array
          items:
            $ref: "#/components/schemas/SystemHealthFirmIssue"
      required: [ok, checkedAt, summary, issues]

    SignalRecord:
      type: object
      description: >
        One structured evidence signal captured for a pillar during pipeline
        scoring. Evidence metadata only; never feeds composite/tier math.
      required: [id, companySlug, pillarId, source, direction, confidence, note]
      properties:
        id:
          type: integer
        companySlug:
          type: string
        pillarId:
          type: string
          description: One of the 8 portfolio-engine pillar ids
        source:
          type: string
          description: >
            Where the signal was observed, e.g. "linkedin", "job_posting",
            "g2_capterra", "press", "crunchbase", "pitchbook", "company_site",
            "other"
        dateObserved:
          type: string
          nullable: true
          description: ISO date (YYYY-MM-DD) when the artifact is dated
        url:
          type: string
          nullable: true
        direction:
          type: string
          enum: [positive, negative, neutral]
        confidence:
          type: string
          enum: [High, Medium, Low]
        note:
          type: string

    RavigaSignals:
      type: object
      required: [signals]
      properties:
        signals:
          type: array
          items:
            $ref: "#/components/schemas/SignalRecord"

    PortfolioBootstrap:
      type: object
      properties:
        asOfDate:
          type: string
        firms:
          type: array
          items:
            $ref: "#/components/schemas/PortfolioBootstrapFirm"
      required:
        - asOfDate
        - firms
