openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: CS Rescue API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: architecture
    description: Architecture nodes and diagram
  - name: resources
    description: System resources and integrations
  - name: connectors
    description: Connector registry and configuration
  - name: deployments
    description: Customer deployments and rollouts
  - name: accounts
    description: Customer accounts
  - name: lifecycle
    description: Lifecycle motions
  - name: portfolio
    description: PE-firm tenant portfolio bootstrap data
  - name: Auth
    description: Browser and mobile authentication endpoints.
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /architecture:
    get:
      operationId: getArchitecture
      tags: [architecture]
      summary: Get full architecture map
      responses:
        "200":
          description: Full architecture data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchitectureMap"

  /graph:
    get:
      operationId: getGraph
      tags: [architecture]
      summary: Get the full architecture graph (nodes + edges + groups)
      responses:
        "200":
          description: Graph data for visualization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GraphData"

  /edges:
    get:
      operationId: listEdges
      tags: [architecture]
      summary: List all architecture edges
      responses:
        "200":
          description: List of edges
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ArchitectureEdge"

  /metrics/{nodeId}:
    get:
      operationId: getNodeMetrics
      tags: [architecture]
      summary: Get time-series metrics for a node
      parameters:
        - name: nodeId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of metric series for the node
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NodeMetricSeries"

  /architecture/nodes:
    get:
      operationId: listArchitectureNodes
      tags: [architecture]
      summary: List all architecture nodes
      parameters:
        - name: layer
          in: query
          schema:
            type: string
            enum: [lifecycle, delivery, platform]
        - name: lifecycleMotionId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of nodes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ArchitectureNode"

  /architecture/nodes/{id}:
    get:
      operationId: getArchitectureNode
      tags: [architecture]
      summary: Get a specific architecture node
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Node detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchitectureNode"
        "404":
          description: Not found

  /architecture/summary:
    get:
      operationId: getArchitectureSummary
      tags: [architecture]
      summary: Get architecture summary stats
      responses:
        "200":
          description: Summary statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchitectureSummary"

  /resources:
    get:
      operationId: listResources
      tags: [resources]
      summary: List all resources
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of resources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Resource"
    post:
      operationId: createResource
      tags: [resources]
      summary: Create a new resource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewResourceInput"
      responses:
        "201":
          description: Created resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"

  /resources/{id}:
    get:
      operationId: getResource
      tags: [resources]
      summary: Get a resource by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Resource detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"
        "404":
          description: Not found
    patch:
      operationId: updateResource
      tags: [resources]
      summary: Update a resource
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchResourceInput"
      responses:
        "200":
          description: Updated resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"

  /connectors:
    get:
      operationId: listConnectors
      tags: [connectors]
      summary: List all connectors
      responses:
        "200":
          description: List of connectors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Connector"
    post:
      operationId: createConnector
      tags: [connectors]
      summary: Register a new connector
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewConnectorInput"
      responses:
        "201":
          description: Created connector
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connector"

  /connectors/{id}:
    patch:
      operationId: updateConnector
      tags: [connectors]
      summary: Update a connector
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchConnectorInput"
      responses:
        "200":
          description: Updated connector
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connector"

  /connectors/health:
    get:
      operationId: getConnectorHealth
      tags: [connectors]
      summary: Get health status of all connectors
      responses:
        "200":
          description: Connector health overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectorHealthSummary"

  /deployments:
    get:
      operationId: listDeployments
      tags: [deployments]
      summary: List all deployments
      parameters:
        - name: accountId
          in: query
          schema:
            type: string
        - name: stage
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of deployments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Deployment"

  /deployments/{id}:
    get:
      operationId: getDeployment
      tags: [deployments]
      summary: Get a deployment by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deployment detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deployment"
        "404":
          description: Not found

  /accounts:
    get:
      operationId: listAccounts
      tags: [accounts]
      summary: List all accounts
      responses:
        "200":
          description: List of accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Account"

  /lifecycle-motions:
    get:
      operationId: listLifecycleMotions
      tags: [lifecycle]
      summary: List all lifecycle motions
      responses:
        "200":
          description: List of lifecycle motions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LifecycleMotion"

  /portfolio/bootstrap:
    get:
      operationId: getPortfolioBootstrap
      tags: [portfolio]
      summary: Get raw portfolio bootstrap data for all firm tenants
      description: >
        Serves RAW company/assessment data sourced from Postgres — no derived
        values (tiers, composites, gaps, etc). Clients re-derive those via
        @workspace/portfolio-engine. Returns 500 if the underlying data fails
        validation at load time (fail-soft: never crashes the server).
      responses:
        "200":
          description: Raw portfolio bootstrap payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioBootstrap"
        "500":
          description: Portfolio data failed validation and could not be served
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "200":
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserEnvelope"
  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          description: Relative path to redirect to after login (must start with `/`). Defaults to `/`.
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the OIDC authorization endpoint.
  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: iss
          in: query
          required: false
          schema:
            type: string
            format: uri
      responses:
        "302":
          description: Redirect to the `returnTo` path on success (defaults to `/`) or `/api/login` on failure.
  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the session and begin OIDC logout
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "302":
          description: Redirect to the OIDC provider logout URL.
  /mobile-auth/token-exchange:
    post:
      tags: [Auth]
      operationId: exchangeMobileAuthorizationCode
      summary: Exchange a mobile OIDC code for a session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MobileTokenExchangeRequest"
      responses:
        "200":
          description: Session created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileTokenExchangeSuccess"
        "400":
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Token did not contain usable claims.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Token exchange failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /mobile-auth/logout:
    post:
      tags: [Auth]
      operationId: logoutMobileSession
      summary: Delete a mobile session token
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
      responses:
        "200":
          description: Logout processed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutSuccess"

components:
  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: Opaque session token — `Bearer <sid>`.
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Browser session cookie.
      schema:
        type: string
  schemas:
    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl]
      properties:
        id:
          type: string
        email:
          type: [string, "null"]
          format: email
        firstName:
          type: [string, "null"]
        lastName:
          type: [string, "null"]
        profileImageUrl:
          type: [string, "null"]
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: "#/components/schemas/AuthUser"
            - type: "null"
    MobileTokenExchangeRequest:
      type: object
      required: [code, code_verifier, redirect_uri, state]
      properties:
        code:
          type: string
          minLength: 1
        code_verifier:
          type: string
          minLength: 1
        redirect_uri:
          type: string
          minLength: 1
          format: uri
        state:
          type: string
          minLength: 1
        nonce:
          type: string
          minLength: 1
    MobileTokenExchangeSuccess:
      type: object
      required: [token]
      properties:
        token:
          type: string
    LogoutSuccess:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          const: true
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ArchitectureMap:
      type: object
      properties:
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/ArchitectureNode"
        connections:
          type: array
          items:
            $ref: "#/components/schemas/NodeConnection"
        layers:
          type: array
          items:
            type: string
      required:
        - nodes
        - connections
        - layers

    ArchitectureNode:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
        layer:
          type: string
          enum: [lifecycle, delivery, platform]
        icon:
          type: string
        shortDescription:
          type: string
        capabilities:
          type: array
          items:
            type: string
        lifecycleMotionIds:
          type: array
          items:
            type: string
        connectedNodeIds:
          type: array
          items:
            type: string
        resourceIds:
          type: array
          items:
            type: string
        kpis:
          type: array
          items:
            $ref: "#/components/schemas/KPI"
        status:
          type: string
          enum: [active, degraded, offline, warning]
        ownerTeam:
          type: string
        color:
          type: string
        healthScore:
          type: number
        subtype:
          type: string
        position:
          type: object
          properties:
            x:
              type: number
            y:
              type: number
        visibleToPersonas:
          type: array
          description: Personas for which this node is visible at all
          items:
            type: string
            enum: [vp, sales, post-sales, cs, support, engineering]
        defaultPriorityByPersona:
          type: object
          description: Per-persona priority (primary | secondary | hidden)
          additionalProperties:
            type: string
            enum: [primary, secondary, hidden]
        simplifiedLabel:
          type: string
          description: Short, scannable label for compact card view
        clusterGroup:
          type: string
          description: Logical cluster id for the Business view (e.g. revenue, delivery, customer-data)
        dependencyVisibilityLevel:
          type: string
          enum: [low, medium, high]
          description: How much dependency context to surface for this node
        businessCriticality:
          type: number
          description: 1-5 — how critical to revenue / customer outcomes
        technicalCriticality:
          type: number
          description: 1-5 — how critical to platform stability
        microStat:
          type: string
          description: Single short stat shown on compact cards (e.g. "12 active")
        roleTag:
          type: string
          description: Single role chip shown on compact cards
      required:
        - id
        - name
        - type
        - layer
        - icon
        - shortDescription
        - capabilities
        - lifecycleMotionIds
        - connectedNodeIds
        - resourceIds
        - kpis
        - status
        - ownerTeam
        - color

    ArchitectureEdge:
      type: object
      properties:
        id:
          type: string
        source:
          type: string
        target:
          type: string
        relationshipType:
          type: string
          enum: [data_flow, dependency, sync, composition, control]
        label:
          type: string
        strength:
          type: number
        status:
          type: string
          enum: [active, degraded, inactive]
      required:
        - id
        - source
        - target
        - relationshipType
        - strength
        - status

    ArchitectureGroup:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        layer:
          type: string
        nodeIds:
          type: array
          items:
            type: string
        color:
          type: string
      required:
        - id
        - name
        - layer
        - nodeIds
        - color

    GraphData:
      type: object
      properties:
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/ArchitectureNode"
        edges:
          type: array
          items:
            $ref: "#/components/schemas/ArchitectureEdge"
        groups:
          type: array
          items:
            $ref: "#/components/schemas/ArchitectureGroup"
      required:
        - nodes
        - edges
        - groups

    MetricPoint:
      type: object
      properties:
        timestamp:
          type: string
        value:
          type: number
        label:
          type: string
      required:
        - timestamp
        - value

    NodeMetricSeries:
      type: object
      properties:
        id:
          type: string
        nodeId:
          type: string
        metricName:
          type: string
        unit:
          type: string
        chartType:
          type: string
          enum: [line, bar, donut, radial, sparkline]
        trendDirection:
          type: string
          enum: [up, down, flat]
        currentValue:
          type: number
        delta:
          type: number
        points:
          type: array
          items:
            $ref: "#/components/schemas/MetricPoint"
      required:
        - id
        - nodeId
        - metricName
        - unit
        - chartType
        - points

    NodeConnection:
      type: object
      properties:
        from:
          type: string
        to:
          type: string
        type:
          type: string
          enum: [data, dependency, bidirectional]
      required:
        - from
        - to
        - type

    KPI:
      type: object
      properties:
        label:
          type: string
        value:
          type: string
        trend:
          type: string
          enum: [up, down, flat]
      required:
        - label
        - value

    ArchitectureSummary:
      type: object
      properties:
        totalNodes:
          type: integer
        activeNodes:
          type: integer
        totalResources:
          type: integer
        healthyResources:
          type: integer
        totalConnectors:
          type: integer
        activeDeployments:
          type: integer
        systemHealth:
          type: number
      required:
        - totalNodes
        - activeNodes
        - totalResources
        - healthyResources
        - totalConnectors
        - activeDeployments
        - systemHealth

    Resource:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        category:
          type: string
        vendor:
          type: string
        environment:
          type: string
          enum: [production, sandbox, staging]
        status:
          type: string
          enum: [connected, disconnected, degraded, pending]
        dataDirection:
          type: string
          enum: [inbound, outbound, bidirectional]
        linkedNodeIds:
          type: array
          items:
            type: string
        owner:
          type: string
        sensitivity:
          type: string
          enum: [public, internal, confidential, restricted]
        lastSyncAt:
          type: string
          nullable: true
        metadata:
          type: object
          additionalProperties: true
      required:
        - id
        - name
        - category
        - vendor
        - environment
        - status
        - dataDirection
        - linkedNodeIds
        - owner
        - sensitivity

    NewResourceInput:
      type: object
      properties:
        name:
          type: string
        category:
          type: string
        vendor:
          type: string
        environment:
          type: string
          enum: [production, sandbox, staging]
        dataDirection:
          type: string
          enum: [inbound, outbound, bidirectional]
        linkedNodeIds:
          type: array
          items:
            type: string
        owner:
          type: string
        sensitivity:
          type: string
          enum: [public, internal, confidential, restricted]
      required:
        - name
        - category
        - vendor
        - environment
        - dataDirection
        - linkedNodeIds
        - owner
        - sensitivity

    PatchResourceInput:
      type: object
      properties:
        status:
          type: string
          enum: [connected, disconnected, degraded, pending]
        environment:
          type: string
          enum: [production, sandbox, staging]
        dataDirection:
          type: string
          enum: [inbound, outbound, bidirectional]
        owner:
          type: string
        sensitivity:
          type: string
          enum: [public, internal, confidential, restricted]

    Connector:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
        authType:
          type: string
          enum: [oauth2, api_key, basic, jwt, none]
        status:
          type: string
          enum: [enabled, disabled, pending]
        health:
          type: string
          enum: [healthy, degraded, offline, unknown]
        configSchema:
          type: object
          additionalProperties: true
        supportedResourceCategories:
          type: array
          items:
            type: string
        environment:
          type: string
          enum: [production, sandbox, staging]
        dataOwner:
          type: string
        businessOwner:
          type: string
        syncDirection:
          type: string
          enum: [inbound, outbound, bidirectional]
        sensitivityLevel:
          type: string
          enum: [public, internal, confidential, restricted]
        dependencies:
          type: array
          items:
            type: string
        lastCheckedAt:
          type: string
          nullable: true
      required:
        - id
        - name
        - type
        - authType
        - status
        - health
        - supportedResourceCategories
        - environment
        - dataOwner
        - businessOwner
        - syncDirection
        - sensitivityLevel
        - dependencies

    NewConnectorInput:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
        authType:
          type: string
          enum: [oauth2, api_key, basic, jwt, none]
        environment:
          type: string
          enum: [production, sandbox, staging]
        dataOwner:
          type: string
        businessOwner:
          type: string
        syncDirection:
          type: string
          enum: [inbound, outbound, bidirectional]
        sensitivityLevel:
          type: string
          enum: [public, internal, confidential, restricted]
      required:
        - name
        - type
        - authType
        - environment
        - dataOwner
        - businessOwner
        - syncDirection
        - sensitivityLevel

    PatchConnectorInput:
      type: object
      properties:
        status:
          type: string
          enum: [enabled, disabled, pending]
        health:
          type: string
          enum: [healthy, degraded, offline, unknown]
        syncDirection:
          type: string
          enum: [inbound, outbound, bidirectional]
        environment:
          type: string
          enum: [production, sandbox, staging]
        dataOwner:
          type: string
        businessOwner:
          type: string

    ConnectorHealthSummary:
      type: object
      properties:
        healthy:
          type: integer
        degraded:
          type: integer
        offline:
          type: integer
        unknown:
          type: integer
        total:
          type: integer
        connectors:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              health:
                type: string
              lastCheckedAt:
                type: string
                nullable: true
            required:
              - id
              - name
              - health
      required:
        - healthy
        - degraded
        - offline
        - unknown
        - total
        - connectors

    Deployment:
      type: object
      properties:
        id:
          type: string
        accountId:
          type: string
        accountName:
          type: string
        name:
          type: string
        stage:
          type: string
          enum: [pre_sales, contracting, implementation, csm, support, completed]
        architectureNodeIds:
          type: array
          items:
            type: string
        resourceIds:
          type: array
          items:
            type: string
        blockers:
          type: array
          items:
            $ref: "#/components/schemas/Blocker"
        milestones:
          type: array
          items:
            $ref: "#/components/schemas/Milestone"
        healthScore:
          type: number
        startedAt:
          type: string
        estimatedCompletionAt:
          type: string
          nullable: true
        workstreams:
          type: array
          items:
            $ref: "#/components/schemas/Workstream"
      required:
        - id
        - accountId
        - accountName
        - name
        - stage
        - architectureNodeIds
        - resourceIds
        - blockers
        - milestones
        - healthScore
        - startedAt
        - workstreams

    Blocker:
      type: object
      properties:
        id:
          type: string
        description:
          type: string
        severity:
          type: string
          enum: [critical, high, medium, low]
        status:
          type: string
          enum: [open, in_progress, resolved]
        owner:
          type: string
      required:
        - id
        - description
        - severity
        - status
        - owner

    Milestone:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [completed, in_progress, pending, blocked]
        dueDate:
          type: string
          nullable: true
        completedAt:
          type: string
          nullable: true
      required:
        - id
        - name
        - status

    Workstream:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [active, paused, completed, not_started]
        owner:
          type: string
        progress:
          type: number
      required:
        - id
        - name
        - status
        - owner
        - progress

    Account:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        segment:
          type: string
          enum: [enterprise, mid_market, smb]
        lifecycleStage:
          type: string
          enum: [pre_sales, contracting, implementation, csm, support, churned]
        deploymentIds:
          type: array
          items:
            type: string
        owner:
          type: string
        status:
          type: string
          enum: [active, at_risk, churned, prospect]
        industry:
          type: string
        arr:
          type: number
          nullable: true
      required:
        - id
        - name
        - segment
        - lifecycleStage
        - deploymentIds
        - owner
        - status
        - industry

    LifecycleMotion:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        icon:
          type: string
        description:
          type: string
        order:
          type: integer
        color:
          type: string
        nodeIds:
          type: array
          items:
            type: string
        kpis:
          type: array
          items:
            $ref: "#/components/schemas/KPI"
      required:
        - id
        - name
        - icon
        - description
        - order
        - color
        - nodeIds
        - kpis

    PortfolioActionLogEntry:
      type: object
      description: Dated event annotated as a marker on the trend / forecast chart.
      properties:
        date:
          type: string
        label:
          type: string
      required:
        - date
        - label

    PortfolioAssessment:
      type: object
      description: A single diagnostic run for a company. The company's current state always derives from the LATEST assessment in the array.
      properties:
        date:
          type: string
        pillarScores:
          type: object
          description: Keyed by pillar id; all 8 pillars must be present. 0/1/2 = scored, null = Insufficient Data (NA).
          additionalProperties:
            type: [integer, "null"]
            enum: [0, 1, 2, null]
        note:
          type: string
      required:
        - date
        - pillarScores

    PortfolioCompany:
      type: object
      description: Raw company record — only raw inputs, never derived values (RawCompany in @workspace/portfolio-engine).
      properties:
        id:
          type: string
        name:
          type: string
        sector:
          type: string
        hq:
          type: string
        employeesDisplay:
          type: string
        arrDisplay:
          type: string
        arrForRollup:
          type: [array, "null"]
          minItems: 2
          maxItems: 2
          items:
            type: number
        confidence:
          type: string
          enum: [High, Medium, Low]
        engagement:
          type: string
        invesqSignal:
          type: string
        leadershipFraming:
          type: string
          enum: [establish]
        summary:
          type: string
        calloutNote:
          type: string
        assessments:
          type: array
          items:
            $ref: "#/components/schemas/PortfolioAssessment"
        gapNotes:
          type: object
          additionalProperties:
            type: string
        actionsLog:
          type: array
          items:
            $ref: "#/components/schemas/PortfolioActionLogEntry"
      required:
        - id
        - name
        - sector
        - hq
        - employeesDisplay
        - arrDisplay
        - arrForRollup
        - confidence
        - engagement
        - invesqSignal
        - summary
        - assessments

    PortfolioBootstrapFirm:
      type: object
      properties:
        slug:
          type: string
        displayName:
          type: string
        statusLabel:
          type: string
        internalOnly:
          type: boolean
        companies:
          type: array
          items:
            $ref: "#/components/schemas/PortfolioCompany"
      required:
        - slug
        - displayName
        - statusLabel
        - internalOnly
        - companies

    PortfolioBootstrap:
      type: object
      properties:
        asOfDate:
          type: string
        firms:
          type: array
          items:
            $ref: "#/components/schemas/PortfolioBootstrapFirm"
      required:
        - asOfDate
        - firms
