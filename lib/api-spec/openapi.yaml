openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: CS Rescue API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: architecture
    description: Architecture nodes and diagram
  - name: resources
    description: System resources and integrations
  - name: connectors
    description: Connector registry and configuration
  - name: deployments
    description: Customer deployments and rollouts
  - name: accounts
    description: Customer accounts
  - name: lifecycle
    description: Lifecycle motions
  - name: portfolio
    description: PE-firm tenant portfolio bootstrap data
  - name: Auth
    description: Browser and mobile authentication endpoints.
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /architecture:
    get:
      operationId: getArchitecture
      tags: [architecture]
      summary: Get full architecture map
      responses:
        "200":
          description: Full architecture data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchitectureMap"

  /graph:
    get:
      operationId: getGraph
      tags: [architecture]
      summary: Get the full architecture graph (nodes + edges + groups)
      responses:
        "200":
          description: Graph data for visualization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GraphData"

  /edges:
    get:
      operationId: listEdges
      tags: [architecture]
      summary: List all architecture edges
      responses:
        "200":
          description: List of edges
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ArchitectureEdge"

  /metrics/{nodeId}:
    get:
      operationId: getNodeMetrics
      tags: [architecture]
      summary: Get time-series metrics for a node
      parameters:
        - name: nodeId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of metric series for the node
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NodeMetricSeries"

  /architecture/nodes:
    get:
      operationId: listArchitectureNodes
      tags: [architecture]
      summary: List all architecture nodes
      parameters:
        - name: layer
          in: query
          schema:
            type: string
            enum: [lifecycle, delivery, platform]
        - name: lifecycleMotionId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of nodes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ArchitectureNode"

  /architecture/nodes/{id}:
    get:
      operationId: getArchitectureNode
      tags: [architecture]
      summary: Get a specific architecture node
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Node detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchitectureNode"
        "404":
          description: Not found

  /architecture/summary:
    get:
      operationId: getArchitectureSummary
      tags: [architecture]
      summary: Get architecture summary stats
      responses:
        "200":
          description: Summary statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchitectureSummary"

  /resources:
    get:
      operationId: listResources
      tags: [resources]
      summary: List all resources
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of resources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Resource"
    post:
      operationId: createResource
      tags: [resources]
      summary: Create a new resource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewResourceInput"
      responses:
        "201":
          description: Created resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"

  /resources/{id}:
    get:
      operationId: getResource
      tags: [resources]
      summary: Get a resource by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Resource detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"
        "404":
          description: Not found
    patch:
      operationId: updateResource
      tags: [resources]
      summary: Update a resource
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchResourceInput"
      responses:
        "200":
          description: Updated resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"

  /connectors:
    get:
      operationId: listConnectors
      tags: [connectors]
      summary: List all connectors
      responses:
        "200":
          description: List of connectors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Connector"
    post:
      operationId: createConnector
      tags: [connectors]
      summary: Register a new connector
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewConnectorInput"
      responses:
        "201":
          description: Created connector
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connector"

  /connectors/{id}:
    patch:
      operationId: updateConnector
      tags: [connectors]
      summary: Update a connector
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchConnectorInput"
      responses:
        "200":
          description: Updated connector
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connector"

  /connectors/health:
    get:
      operationId: getConnectorHealth
      tags: [connectors]
      summary: Get health status of all connectors
      responses:
        "200":
          description: Connector health overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectorHealthSummary"

  /deployments:
    get:
      operationId: listDeployments
      tags: [deployments]
      summary: List all deployments
      parameters:
        - name: accountId
          in: query
          schema:
            type: string
        - name: stage
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of deployments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Deployment"

  /deployments/{id}:
    get:
      operationId: getDeployment
      tags: [deployments]
      summary: Get a deployment by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deployment detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deployment"
        "404":
          description: Not found

  /accounts:
    get:
      operationId: listAccounts
      tags: [accounts]
      summary: List all accounts
      responses:
        "200":
          description: List of accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Account"

  /lifecycle-motions:
    get:
      operationId: listLifecycleMotions
      tags: [lifecycle]
      summary: List all lifecycle motions
      responses:
        "200":
          description: List of lifecycle motions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LifecycleMotion"

  /portfolio/bootstrap:
    get:
      operationId: getPortfolioBootstrap
      tags: [portfolio]
      summary: Get raw portfolio bootstrap data for all firm tenants
      description: >
        Serves RAW company/assessment data sourced from Postgres — no derived
        values (tiers, composites, gaps, etc). Clients re-derive those via
        @workspace/portfolio-engine. Returns 500 if the underlying data fails
        validation at load time (fail-soft: never crashes the server).
      responses:
        "200":
          description: Raw portfolio bootstrap payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioBootstrap"
        "500":
          description: Portfolio data failed validation and could not be served
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /portfolio/raviga/signals:
    get:
      operationId: getRavigaSignals
      tags: [portfolio]
      summary: Structured diagnostic signals for the Raviga sandbox tenant
      description: >
        Returns the structured per-pillar evidence signal records captured
        during pipeline scoring for every Raviga company, as a flat list keyed
        by companySlug + pillarId (clients group as needed). Raviga-only demo
        surface: no other firm slug has this route, so every other tenant 404s.
        Signals are evidence metadata only and never participate in
        composite/tier/denominator math.
      responses:
        "200":
          description: Flat list of Raviga signal records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RavigaSignals"
        "404":
          description: Raviga firm row not present in the database
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to load signals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /admin/firms:
    get:
      operationId: listAdminFirms
      tags: [admin]
      summary: List all firms with company counts, for the internal admin index
      responses:
        "200":
          description: All firms
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminFirmSummary"
    post:
      operationId: createAdminFirm
      tags: [admin]
      summary: Create a new firm (status "pending") and queue a discovery job
      description: >
        Landing step of the internal /admin firm-onboarding flow. Creates a
        firm row with status "pending" and a matching jobs row
        (type "discovery", status "queued") targeting that firm. The job is a
        stub — nothing actually runs discovery yet.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAdminFirmInput"
      responses:
        "201":
          description: Created firm and queued discovery job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateAdminFirmResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /admin/firms/order:
    put:
      operationId: reorderAdminFirms
      tags: [admin]
      summary: Persist a custom display order for firms
      description: >
        Admin-only. Accepts the full ordered list of firm ids and writes each
        firm's sort_order to its index in the array (transactional). Firms not
        included keep a null sort_order and list after ordered firms. The
        order applies to every admin firm listing (GET /admin/firms sorts by
        sort_order NULLS LAST, then id).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderAdminFirmsInput"
      responses:
        "200":
          description: Order persisted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResult"
        "400":
          description: Invalid input (unknown or duplicate firm ids)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /admin/firms/manual:
    post:
      operationId: createManualAdminFirm
      tags: [admin]
      summary: Create a firm record directly, without the AI discovery pipeline
      description: >
        Admin-only. Creates a firm row in "pending" status with portal meta
        (statusLabel, internalOnly) and NO discovery job. Companies and
        diagnostics can be added later via the firm review screen's guided
        company entry or by running discovery from there. Slug must be
        lowercase kebab-case, unique, and not a reserved route word.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateManualAdminFirmInput"
      responses:
        "201":
          description: Created firm
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Firm"
        "400":
          description: Invalid input (bad slug format or reserved slug)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: A firm with this slug already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /admin/firms/{id}:
    get:
      operationId: getAdminFirm
      tags: [admin]
      summary: Get a firm and its companies, for the review screen
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Firm detail with companies
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminFirmDetail"
        "404":
          description: Firm not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    patch:
      operationId: updateAdminFirm
      tags: [admin]
      summary: Update a firm's dataAuthority and/or portal meta (admin toggle)
      description: >
        Admin-only. Promotes dataAuthority (best_effort to strict) and/or
        updates portal meta (statusLabel, internalOnly, requireLogin).
        Invalidates the server-side portfolio bootstrap cache so
        meta/requireLogin changes take effect on the next tenant load.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAdminFirmInput"
      responses:
        "200":
          description: Updated firm
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Firm"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Firm not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    delete:
      operationId: deleteAdminFirm
      tags: [admin]
      summary: Permanently delete a firm and all of its data
      description: >
        Admin-only, irreversible. Cascades in FK-safe order through
        report validations, drive shipments, report revisions, Notion sync
        state, report exports, findings, assessments, companies, jobs, and
        ingestion sources before removing the firm row, all in one
        transaction. Rejected (409) for the 5 hand-authored legacy tenants
        (their identity lives in the static frontend registry) and for firms
        with a queued or running job. Invalidates the portfolio bootstrap
        cache so the tenant portal disappears immediately.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Firm deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteAdminFirmResult"
        "400":
          description: Invalid firm id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Firm not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Firm is a protected legacy tenant or has an active job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /admin/firms/{id}/clearance:
    post:
      operationId: setAdminFirmClearance
      tags: [admin]
      summary: Flip a firm's clearance (internalOnly) with admin password verification
      description: >
        Admin-only. Verifies the supplied password against CLEARANCE_ADMIN_PASSWORD
        server-side, then merges the new internalOnly value into firm.meta, and
        invalidates the portfolio bootstrap cache. 401 on wrong password; 503 if
        CLEARANCE_ADMIN_PASSWORD is not configured on the server.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetFirmClearanceInput"
      responses:
        "200":
          description: Updated firm
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Firm"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Wrong clearance password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Firm not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: CLEARANCE_ADMIN_PASSWORD not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /admin/firms/{id}/companies:
    post:
      operationId: addAdminFirmCompany
      tags: [admin]
      summary: Add a company to a firm under review
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddAdminCompanyInput"
      responses:
        "201":
          description: Company added to the firm
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Firm not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /admin/firms/{id}/confirm:
    post:
      operationId: confirmAdminFirm
      tags: [admin]
      summary: Confirm the reviewed company selection and queue a build job
      description: >
        Marks the selected companies "active" and any unselected companies
        "excluded", sets the firm's status to "reviewed", and queues a stub
        jobs row (type "build", status "queued") targeting the firm.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmAdminFirmInput"
      responses:
        "200":
          description: Firm confirmed and build job queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminFirmConfirmResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Firm not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: A build job for this firm is already queued or running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActiveJobConflict"

  /admin/firms/{id}/refresh:
    post:
      operationId: refreshAdminFirm
      tags: [admin]
      summary: Re-run the diagnostic build for an already-onboarded firm
      description: >
        Queues a fresh "build" job for a firm that has already been confirmed
        and built, re-scoring every currently-active company. Each re-run
        APPENDS a new assessment per company (the assessment history is never
        overwritten) and refreshes the company/firm portal metadata. Rejected
        (400) for the 5 hand-authored legacy tenants, which are not
        pipeline-managed. Like confirm, this returns immediately and runs the
        build in the background.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Refresh build job queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminFirmConfirmResult"
        "400":
          description: Invalid firm id, or firm is a hand-authored legacy tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Firm not found, or has no active companies to re-score
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: A build job for this firm is already queued or running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActiveJobConflict"

  /admin/companies/{id}/report-data:
    get:
      operationId: getAdminCompanyReportData
      tags: [admin]
      summary: Get the full editor/validation/delivery workflow state for a company's report
      description: >
        Returns the company's EFFECTIVE report (computed scores/tier/gap-titles
        overlaid with the current edited-or-generated narrative) plus the
        current revision, dual-validation, and Google Drive shipment state.
        Read-only — never calls Claude, so it is safe for React Query to refetch.
        `report.reportData` is safe to copy verbatim into the Claude prompt;
        `report.meta`, `revision`, `validation` and `shipment` are admin-only
        bookkeeping that must NOT be included in the exported JSON.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Report workflow state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminReportWorkflow"
        "404":
          description: Company not found, or has no assessments yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /admin/companies/{id}/report-revision:
    post:
      operationId: saveAdminCompanyReportRevision
      tags: [admin]
      summary: Save an admin edit of the report's narrative sections (creates a new revision)
      description: >
        Persists a new report revision from the admin-edited NARRATIVE sections
        (execSummary, compositeContext, existingSystems, pathForward,
        gaps[].impact/recommendation, nextSteps). Scores, tier, gap
        titles/descriptions, pillar signals/evidence and the P6 recommendation
        stay server-computed and are re-derived, never taken from the body. The
        saved narrative is sanitized (em-dash stripping, name redaction) exactly
        like generated narrative. Saving a revision RESETS all prior validations
        (a new revision must be re-validated). Returns the fresh workflow state.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportRevisionInput"
      responses:
        "200":
          description: Revision saved; fresh workflow state (validation reset)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminReportWorkflow"
        "400":
          description: Invalid company id or malformed body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Company not found, or has no assessments yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /admin/companies/{id}/report-meta:
    patch:
      operationId: updateAdminCompanyReportMeta
      tags: [admin]
      summary: Update the report cover metadata (Prepared For / Prepared By) for a company
      description: >
        Persists the per-company cover-page metadata directly on the companies
        row: Prepared For (name, title, company-line override) and Prepared By
        (name, organization, report date). Only supplied fields are changed; an
        empty string or null clears a field back to its default (blank Prepared
        For lines, the static INVESQ Prepared By constants, the company name,
        today's date). These values are read fresh on every report load, so
        they apply to drafts and validated reports alike WITHOUT creating a
        revision or resetting sign-offs. Returns the fresh workflow state.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateReportMetaInput"
      responses:
        "200":
          description: Cover metadata saved; fresh workflow state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminReportWorkflow"
        "400":
          description: Invalid company id or malformed body (e.g. a non-YYYY-MM-DD date)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Company not found, or has no assessments yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /admin/companies/{id}/pillar-evidence:
    patch:
      operationId: updateAdminCompanyPillarEvidence
      tags: [admin]
      summary: Update the per-pillar evidence text on a company's latest assessment
      description: >
        Persists admin corrections to the raw per-pillar evidence text on the
        company's latest assessment (assessments.p1_evidence..p8_evidence) and
        mirrors each change into the matching findings row. Only supplied
        fields are changed; an empty string or null clears the field. The
        effective report rebuilds pillar evidence and gap descriptions from
        the live assessment on every load, so edits show up immediately in
        the scorecard pillar notes and gap cards WITHOUT creating a revision,
        resetting sign-offs, or changing any score, composite, or tier.
        Returns the fresh workflow state.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePillarEvidenceInput"
      responses:
        "200":
          description: Pillar evidence saved; fresh workflow state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminReportWorkflow"
        "400":
          description: Invalid company id or malformed body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Company not found, or has no assessments yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /admin/companies/{id}/validate:
    post:
      operationId: validateAdminCompanyReport
      tags: [admin]
      summary: Record a validator's sign-off on the current report revision
      description: >
        Records the calling admin (who must be one of the configured
        VALIDATOR_EMAILS) as having validated the company's CURRENT revision.
        Idempotent per (revision, validator). The client PDF unlocks only once
        every configured validator has signed the same current revision.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportValidateInput"
      responses:
        "200":
          description: Validation recorded; fresh workflow state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminReportWorkflow"
        "403":
          description: Caller is not a configured validator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Company not found, has no assessments, or has no saved revision to validate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: The supplied revisionId is not the company's current revision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Validation is not configured (VALIDATOR_EMAILS unset)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /admin/companies/{id}/ship-to-drive:
    post:
      operationId: shipAdminCompanyReportToDrive
      tags: [admin]
      summary: Upload the validated report PDF to Google Drive and record the shipment
      description: >
        Renders the validated (stamped) client PDF and uploads it to Google
        Drive under "INVESQ Customers/{Firm}/{Company}/", then records the
        shipment. Requires the current revision to be fully dual-validated; a
        non-validated report is rejected with 412.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Uploaded to Drive and shipment recorded; fresh workflow state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminReportWorkflow"
        "404":
          description: Company not found, or has no assessments yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "412":
          description: Report is not fully dual-validated, so it cannot be shipped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: Google Drive upload failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /admin/companies/{id}/report-export:
    post:
      operationId: generateAdminCompanyReportExport
      tags: [admin]
      summary: Generate (or return the already-cached) AI-written narrative sections of the report
      description: >
        Fills in the report-data.json fields that require synthesis rather
        than a straight DB read (execSummary, compositeContext,
        existingSystems, pathForward, pillarSignals, each gap's
        impact/recommendation, nextSteps) via Claude, grounded in the
        company's scored pillars/evidence and the Notion scoring rubric.
        Idempotent per (assessment, rubric version): if a report_exports row
        already exists for the company's current latest assessment, it is
        returned as-is with no new Claude call — calling this endpoint
        repeatedly (e.g. a user re-clicking Generate) never re-triggers paid
        generation unless a new assessment has landed or the rubric version
        changed. Synchronous — the response is not returned until generation
        (or the cache check) completes.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Report data with AI-generated narrative sections populated (meta.generatedAt is non-null)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCompanyReportData"
        "404":
          description: Company not found, or has no assessments yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: Claude generation failed (e.g. malformed response, API error)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /admin/backfill-pipeline-meta:
    post:
      operationId: backfillPipelineMeta
      tags: [admin]
      summary: Idempotent data-repair for pipeline-onboarded firms
      description: >
        Repairs the firm-level and company-status data on pipeline-onboarded
        (non-legacy) firms: (1) stamps the default "internal preview" firms.meta
        on any firm that is already "ready" but has no meta, and (2) resolves
        duplicate companies within a firm (same normalized name) by keeping the
        lowest-id active row and marking the rest "excluded" — a unification,
        never a delete. Leaves the 5 hand-authored legacy tenants completely
        untouched. Safe to call repeatedly. Note: this does NOT fabricate
        company CompanyMeta, so a firm built before the pipeline started writing
        full CompanyMeta still needs a re-run (POST /admin/firms/{id}/refresh)
        to render — backfill alone only fixes firm meta and duplicate rows.
      responses:
        "200":
          description: Per-firm repair result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackfillPipelineMetaResult"
        "401":
          description: Not authenticated as an allowed admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Repair failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /admin/system-health:
    get:
      operationId: getAdminSystemHealth
      tags: [admin]
      summary: Live system health audit of all firm states
      description: >
        Returns a structured health report classifying every firm by its current
        operational state. Stuck, discovery-empty, and build-failed firms are
        flagged with their recovery URLs. Used by the admin Health dashboard
        and the pre-publish gate banner.
      responses:
        "200":
          description: System health report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemHealthReport"
        "401":
          description: Not authenticated as an allowed admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /jobs/{id}:
    get:
      operationId: getJob
      tags: [jobs]
      summary: Get a job's current status, progress, and ETA
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Job status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          description: Job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "200":
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserEnvelope"
  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          description: Relative path to redirect to after login (must start with `/`). Defaults to `/`.
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the OIDC authorization endpoint.
  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: iss
          in: query
          required: false
          schema:
            type: string
            format: uri
      responses:
        "302":
          description: Redirect to the `returnTo` path on success (defaults to `/`) or `/api/login` on failure.
  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the session and begin OIDC logout
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "302":
          description: Redirect to the OIDC provider logout URL.
  /mobile-auth/token-exchange:
    post:
      tags: [Auth]
      operationId: exchangeMobileAuthorizationCode
      summary: Exchange a mobile OIDC code for a session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MobileTokenExchangeRequest"
      responses:
        "200":
          description: Session created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileTokenExchangeSuccess"
        "400":
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Token did not contain usable claims.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Token exchange failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /mobile-auth/logout:
    post:
      tags: [Auth]
      operationId: logoutMobileSession
      summary: Delete a mobile session token
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
      responses:
        "200":
          description: Logout processed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutSuccess"

components:
  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: Opaque session token — `Bearer <sid>`.
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Browser session cookie.
      schema:
        type: string
  schemas:
    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl]
      properties:
        id:
          type: string
        email:
          type: [string, "null"]
          format: email
        firstName:
          type: [string, "null"]
        lastName:
          type: [string, "null"]
        profileImageUrl:
          type: [string, "null"]
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: "#/components/schemas/AuthUser"
            - type: "null"
    MobileTokenExchangeRequest:
      type: object
      required: [code, code_verifier, redirect_uri, state]
      properties:
        code:
          type: string
          minLength: 1
        code_verifier:
          type: string
          minLength: 1
        redirect_uri:
          type: string
          minLength: 1
          format: uri
        state:
          type: string
          minLength: 1
        nonce:
          type: string
          minLength: 1
    MobileTokenExchangeSuccess:
      type: object
      required: [token]
      properties:
        token:
          type: string
    LogoutSuccess:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          const: true
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string

    ActiveJobConflict:
      type: object
      description: >
        Returned instead of creating a duplicate job when the target already
        has a queued/running job of the requested type.
      required: [error, job]
      properties:
        error:
          type: string
        job:
          $ref: "#/components/schemas/Job"

    CreateAdminFirmInput:
      type: object
      required: [name, website]
      properties:
        name:
          type: string
          minLength: 1
        website:
          type: string
          minLength: 1

    FirmMeta:
      type: object
      required: [statusLabel, internalOnly]
      properties:
        statusLabel:
          type: string
        internalOnly:
          type: boolean
        requireLogin:
          type: boolean
          description: >
            When true, the tenant portal for this firm requires an
            authenticated admin session to view. Default/absent = false
            (public). UI-gate only; the bootstrap API stays public.

    Firm:
      type: object
      required: [id, name, website, slug, status, dataAuthority, meta, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        website:
          type: [string, "null"]
        slug:
          type: string
        status:
          type: string
        dataAuthority:
          type: string
          enum: [strict, best_effort]
          description: >
            "strict" firms fail loudly on bad data; "best_effort" degrade
            gracefully. Promotion is always an explicit admin action.
        meta:
          description: >
            Portal display metadata (statusLabel, internalOnly, requireLogin).
            Null for pipeline firms not yet promoted to a tenant portal.
          oneOf:
            - $ref: "#/components/schemas/FirmMeta"
            - type: "null"
        createdByEmail:
          type: [string, "null"]
          description: >
            Email of the admin who created this firm, captured from their
            session at creation time. Used to notify them when the build job
            finishes. Null for firms created before this field existed or
            outside an authenticated session.
        createdAt:
          type: string
          format: date-time

    Job:
      type: object
      required: [id, type, targetId, status, progressPct, etaSeconds, error]
      properties:
        id:
          type: integer
        type:
          type: string
        targetId:
          type: string
        status:
          type: string
        progressPct:
          type: integer
        etaSeconds:
          type: [integer, "null"]
        error:
          type: [string, "null"]

    CreateAdminFirmResponse:
      type: object
      required: [firm, job]
      properties:
        firm:
          $ref: "#/components/schemas/Firm"
        job:
          $ref: "#/components/schemas/Job"

    OkResult:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean

    ReorderAdminFirmsInput:
      type: object
      required: [firmIds]
      properties:
        firmIds:
          type: array
          description: >
            Firm ids in the desired display order. Each firm's sort_order is
            set to its index. Ids must be unique and must all exist.
          items:
            type: integer
          minItems: 1

    CreateManualAdminFirmInput:
      type: object
      required: [name, slug]
      properties:
        name:
          type: string
          minLength: 1
        slug:
          type: string
          minLength: 1
          description: >
            Lowercase kebab-case URL slug (letters, digits, hyphens). Must be
            unique and not a reserved route word (e.g. admin, portfolio, api).
        statusLabel:
          type: string
          description: Optional portal status pill text (stored in meta).
        internalOnly:
          type: boolean
          description: Marks the firm internal-only in portal meta. Default false.

    DeleteAdminFirmResult:
      type: object
      required: [deletedFirmId, removedCompanies, removedAssessments]
      properties:
        deletedFirmId:
          type: integer
        removedCompanies:
          type: integer
        removedAssessments:
          type: integer

    AdminFirmSummary:
      type: object
      required: [id, name, website, slug, status, dataAuthority, meta, companyCount, createdAt, latestJob, sortOrder]
      properties:
        id:
          type: integer
        name:
          type: string
        website:
          type: [string, "null"]
        slug:
          type: string
        status:
          type: string
        dataAuthority:
          type: string
          enum: [strict, best_effort]
        meta:
          description: Portal display metadata, or null for pipeline firms not yet promoted to a tenant portal.
          oneOf:
            - $ref: "#/components/schemas/FirmMeta"
            - type: "null"
        companyCount:
          type: integer
        latestJob:
          description: The most recently created job (any status) targeting this firm, or null if none exists.
          oneOf:
            - $ref: "#/components/schemas/Job"
            - type: "null"
        sortOrder:
          type: [integer, "null"]
          description: >
            Admin-controlled display position (lower = first); null =
            unordered, listed after ordered firms. The list is already sorted
            by this server-side.
        createdAt:
          type: string
          format: date-time

    Company:
      type: object
      required: [id, firmId, name, website, status, slug, createdAt, hasAssessment]
      properties:
        id:
          type: integer
        firmId:
          type: integer
        name:
          type: string
        website:
          type: [string, "null"]
        status:
          type: string
        slug:
          type: [string, "null"]
        createdAt:
          type: string
          format: date-time
        hasAssessment:
          type: boolean
          description: Whether the company has at least one assessment row (eligible for report export).

    AdminCompanyReportData:
      type: object
      description: >
        Assembled report-data.json export payload for the Diagnostic Report
        pattern. `reportData` matches the external report-data.json schema
        (Notion: "External CS Diagnostic — Scoring Rubric & Cowork
        Instructions", Step 7) field-for-field, so it is safe to copy
        verbatim into the Claude design-file prompt. `meta` carries
        admin-only context (assessment provenance, derived composite/tier)
        that must NOT be included in the exported JSON.
      required: [reportData, meta]
      properties:
        reportData:
          $ref: "#/components/schemas/DiagnosticReportData"
        meta:
          type: object
          required:
            [
              companyId,
              assessmentDate,
              composite,
              compositeMax,
              tier,
              generatedAt,
              model,
              preparedByName,
              preparedByOrg,
              preparedForCompany,
              preparedForCompanyOverride,
            ]
          properties:
            companyId:
              type: integer
            assessmentDate:
              type: string
              description: Date of the source assessment used (ISO date).
            composite:
              type: number
            compositeMax:
              type: number
            tier:
              type: string
            generatedAt:
              type: [string, "null"]
              description: >
                When the AI-generated narrative sections (execSummary,
                compositeContext, existingSystems, pathForward, pillarSignals,
                gap impact/recommendation, nextSteps) were produced, or null
                if this response still carries the blank-placeholder fallback
                (no report_exports row yet for this assessment).
            model:
              type: [string, "null"]
              description: Claude model used to generate the narrative, or null if not yet generated.
            preparedByName:
              type: string
              description: >
                Effective "Prepared By - Name" cover line (per-company override
                from the companies row, else the static INVESQ default). Cover
                display metadata only, kept OUT of the exported report-data.json.
            preparedByOrg:
              type: string
              description: Effective "Prepared By - Organization" cover line (override else "INVESQ").
            preparedForCompany:
              type: string
              description: >
                Effective "Prepared For - Company" cover line (override else the
                company's name). Only affects the cover card, never the report
                H1 or narrative.
            preparedForCompanyOverride:
              type: [string, "null"]
              description: The raw stored override for the Prepared For company line, or null when unset.

    DiagnosticReportData:
      type: object
      description: >
        Exact shape of report-data.json per the Notion scoring rubric's Step
        7 ("Producing the Branded Client PDF"). Fields with no real data yet
        are left as "" / [] — the branded report template treats a blank
        field as an accepted, designed fallback (a neutral placeholder), not
        an error.
      required:
        [
          companyName,
          parentFund,
          preparedForName,
          preparedForTitle,
          reportDate,
          csHeadcount,
          execSummary,
          compositeContext,
          existingSystems,
          pathForward,
          scores,
          pillarSignals,
          pillarEvidence,
          p6Recommendation,
          gaps,
          nextSteps,
        ]
      properties:
        companyName:
          type: string
        parentFund:
          type: string
        preparedForName:
          type: string
        preparedForTitle:
          type: string
        reportDate:
          type: string
          description: Date this report-data.json was assembled (ISO date).
        csHeadcount:
          type: string
        execSummary:
          type: array
          description: One string per paragraph.
          items:
            type: string
        compositeContext:
          type: string
        existingSystems:
          type: string
        pathForward:
          type: string
        scores:
          type: object
          description: Raw pillar scores 0/1/2, or "NA" for Insufficient Data.
          required: [p1, p2, p3, p4, p5, p6, p7, p8]
          properties:
            p1:
              type: [integer, string]
            p2:
              type: [integer, string]
            p3:
              type: [integer, string]
            p4:
              type: [integer, string]
            p5:
              type: [integer, string]
            p6:
              type: [integer, string]
            p7:
              type: [integer, string]
            p8:
              type: [integer, string]
        pillarSignals:
          type: object
          description: >
            One-line "what the signals show" per pillar (scorecard column).
            Left "" when no data beyond the raw score is on file.
          required: [p1, p2, p3, p4, p5, p6, p7, p8]
          properties:
            p1:
              type: string
            p2:
              type: string
            p3:
              type: string
            p4:
              type: string
            p5:
              type: string
            p6:
              type: string
            p7:
              type: string
            p8:
              type: string
        pillarEvidence:
          type: object
          description: >
            Longer pillar-by-pillar narrative Claude produced during scoring
            (assessments.p{n}Evidence). Left "" when no evidence is on file.
          required: [p1, p2, p3, p4, p5, p6, p7, p8]
          properties:
            p1:
              type: string
            p2:
              type: string
            p3:
              type: string
            p4:
              type: string
            p5:
              type: string
            p6:
              type: string
            p7:
              type: string
            p8:
              type: string
        p6Recommendation:
          type: string
          description: >
            Derived from the p6 (CS Leadership) score: 2 = "Retain and
            Develop", 1 = "Augment", 0 = "Replace". Empty if p6 is "NA".
        gaps:
          type: array
          description: Top 3 identified gaps (the three lowest-scoring pillars).
          items:
            type: object
            required: [title, description, impact, recommendation]
            properties:
              title:
                type: string
              description:
                type: string
              impact:
                type: string
              recommendation:
                type: string
        nextSteps:
          type: array
          items:
            type: string

    ReportValidator:
      type: object
      required: [email, name, hasValidated, validatedAt]
      properties:
        email:
          type: string
        name:
          type: string
        hasValidated:
          type: boolean
          description: Whether this validator has signed off on the CURRENT revision.
        validatedAt:
          type: [string, "null"]
        overrideFor:
          type: [string, "null"]
          description: If this validator submitted an override, the email of the validator they overrode. Null on a normal sign-off.
        overrideReason:
          type: [string, "null"]
          description: The typed override justification, or null if no override was submitted.

    ReportValidationState:
      type: object
      description: >
        Dual-validation state for the company's current report revision.
        `configured` is false when VALIDATOR_EMAILS is unset (fail-closed:
        validation is impossible and the client PDF stays locked).
      required:
        [
          configured,
          requiredCount,
          validatedCount,
          isValidated,
          validators,
          validatorNames,
          validatedAt,
        ]
      properties:
        configured:
          type: boolean
        requiredCount:
          type: integer
          description: Number of configured validators required to unlock the client PDF.
        validatedCount:
          type: integer
          description: How many required validators have signed the current revision.
        isValidated:
          type: boolean
          description: >
            True when a current revision exists and either every configured validator has
            signed it, or one validator has submitted an override for the other's missing
            sign-off (override_for IS NOT NULL on any validation row for the revision).
        validators:
          type: array
          items:
            $ref: "#/components/schemas/ReportValidator"
        validatorNames:
          type: array
          description: Display names of the validators who have signed the current revision (used for the PDF stamp).
          items:
            type: string
        validatedAt:
          type: [string, "null"]
          description: Timestamp of the most recent signature on the current revision, or null.

    ReportRevisionState:
      type: object
      description: >
        The company's current (latest, matching-rubric-version) saved narrative
        revision, or a hasRevision:false placeholder when none has been saved.
      required:
        [hasRevision, revisionId, rubricVersion, isStale, editedByEmail, editedByName, createdAt]
      properties:
        hasRevision:
          type: boolean
        revisionId:
          type: [integer, "null"]
        rubricVersion:
          type: [string, "null"]
        isStale:
          type: boolean
          description: True when the revision's rubricVersion differs from the server's current RUBRIC_VERSION.
        editedByEmail:
          type: [string, "null"]
        editedByName:
          type: [string, "null"]
        createdAt:
          type: [string, "null"]

    DriveShipmentState:
      type: object
      description: The latest Google Drive shipment recorded for this company, if any.
      required:
        [shipped, isCurrent, revisionId, fileId, webViewLink, folderPath, shippedByName, shippedAt]
      properties:
        shipped:
          type: boolean
        isCurrent:
          type: boolean
          description: True when the shipped revision is the company's current revision.
        revisionId:
          type: [integer, "null"]
        fileId:
          type: [string, "null"]
        webViewLink:
          type: [string, "null"]
        folderPath:
          type: [string, "null"]
        shippedByName:
          type: [string, "null"]
        shippedAt:
          type: [string, "null"]

    AdminReportWorkflow:
      type: object
      description: >
        Full editor/validation/delivery state for a company's current report:
        the effective report data (computed scores/tier/gap-titles + the current
        edited-or-generated narrative), plus revision, dual-validation, and
        Google Drive shipment state.
      required: [report, revision, validation, shipment]
      properties:
        report:
          $ref: "#/components/schemas/AdminCompanyReportData"
        revision:
          $ref: "#/components/schemas/ReportRevisionState"
        validation:
          $ref: "#/components/schemas/ReportValidationState"
        shipment:
          $ref: "#/components/schemas/DriveShipmentState"

    ReportRevisionGapInput:
      type: object
      required: [title, impact, recommendation]
      properties:
        title:
          type: string
          description: Used only to match the gap to its computed slot; the server keeps the computed title/description.
        impact:
          type: string
        recommendation:
          type: string

    ReportRevisionInput:
      type: object
      description: >
        Narrative-only edit payload. Only these fields are editable; scores,
        tier, gap titles/descriptions, pillar signals/evidence and the P6
        recommendation stay server-computed and are ignored if sent.
      required: [execSummary, compositeContext, existingSystems, pathForward, nextSteps, gaps]
      properties:
        execSummary:
          type: array
          items:
            type: string
        compositeContext:
          type: string
        existingSystems:
          type: string
        pathForward:
          type: string
        nextSteps:
          type: array
          items:
            type: string
        gaps:
          type: array
          items:
            $ref: "#/components/schemas/ReportRevisionGapInput"

    ReportValidateInput:
      type: object
      required: [revisionId]
      properties:
        revisionId:
          type: integer
          description: The revision the caller intends to validate; must equal the current revision or the request 409s.
        overrideFor:
          type: [string, "null"]
          description: >
            Email of the validator being overridden. When present, overrideReason is
            also required. The submitter's sign-off is recorded AND the other validator's
            missing sign-off is waived, unlocking the client PDF. Stored in
            report_validations.override_for.
        overrideReason:
          type: [string, "null"]
          description: >
            Mandatory justification text when overrideFor is set. Stored verbatim and
            shown in the PDF validation stamp as "override: {other} - {reason}".

    UpdateReportMetaInput:
      type: object
      description: >
        Partial cover-metadata update. Every field is optional; only supplied
        fields are changed. An empty string or null clears the field back to
        its default (blank Prepared For lines, static INVESQ Prepared By
        constants, the company name, today's date).
      properties:
        preparedForName:
          type: [string, "null"]
        preparedForTitle:
          type: [string, "null"]
        preparedForCompany:
          type: [string, "null"]
          description: Override for the Prepared For card's Company line only; never changes the report H1 or narrative.
        preparedByName:
          type: [string, "null"]
        preparedByOrg:
          type: [string, "null"]
        preparedByDate:
          type: [string, "null"]
          pattern: "^\\d{4}-\\d{2}-\\d{2}$"
          description: Report date shown on the Prepared By card (YYYY-MM-DD); becomes reportData.reportDate.

    UpdatePillarEvidenceInput:
      type: object
      description: >
        Partial per-pillar evidence update for the company's latest
        assessment. Every field is optional; only supplied fields are
        changed. An empty string or null clears the field. Keys map to
        assessments.p1_evidence..p8_evidence in PILLARS order (p1 CS Org
        Design through p8 AI Adoption Maturity).
      properties:
        p1:
          type: [string, "null"]
        p2:
          type: [string, "null"]
        p3:
          type: [string, "null"]
        p4:
          type: [string, "null"]
        p5:
          type: [string, "null"]
        p6:
          type: [string, "null"]
        p7:
          type: [string, "null"]
        p8:
          type: [string, "null"]

