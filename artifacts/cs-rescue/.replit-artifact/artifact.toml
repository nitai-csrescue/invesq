kind = "web"
previewPath = "/"
title = "CS Rescue"
version = "1.0.0"
id = "artifacts/cs-rescue"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21115

[services.development]
run = "pnpm --filter @workspace/cs-rescue run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/cs-rescue", "run", "build" ]
publicDir = "artifacts/cs-rescue/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21115"
BASE_PATH = "/"
