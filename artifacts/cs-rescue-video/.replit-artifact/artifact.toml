kind = "video"
previewPath = "/cs-rescue-video/"
title = "CS Rescue Product Demo Video"
version = "1.0.0"
id = "artifacts/cs-rescue-video"
router = "path"

[[integratedSkills]]
name = "video-js"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/cs-rescue-video/" ]
localPort = 22333

[services.development]
run = "pnpm --filter @workspace/cs-rescue-video run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/cs-rescue-video", "run", "build" ]
publicDir = "artifacts/cs-rescue-video/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22333"
BASE_PATH = "/cs-rescue-video/"
